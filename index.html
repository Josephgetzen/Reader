<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadSync | Enterprise RSVP Pipeline</title>
    
    <!-- Enterprise CDNs for Multi-Format File Ingestion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #030305;
            --text-main: #f1f1f1;
            --text-muted: #666;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --pivot-color: #ef4444; 
            --ui-bg: #0f1115;
            --ui-card: #16181d;
            --border: #262933;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-read: 'Courier New', Courier, monospace; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-ui); }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- Transitions & Layers --- */
        .layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: var(--bg-color); transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .hidden { opacity: 0; pointer-events: none; transform: scale(0.97); z-index: -1; }

        /* --- Zen Fullscreen Mode --- */
        body.zen-idle { cursor: none; }
        body.zen-idle .hud { opacity: 0; pointer-events: none; }
        body.zen-idle #sidebar { left: -320px; }

        /* --- UI Card --- */
        .card {
            width: 90%; max-width: 800px; background: var(--ui-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 35px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            max-height: 95vh; overflow-y: auto; z-index: 50;
        }

        h1 { font-weight: 300; text-align: center; letter-spacing: 4px; margin-bottom: 25px; font-size: 2.2rem; }
        h1 span { color: var(--accent-color); font-weight: 600; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.75rem; color: #999; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        select, input[type="range"], input[type="text"], input[type="number"], button {
            background: #0a0b0e; border: 1px solid var(--border); color: white;
            padding: 12px; border-radius: 8px; outline: none; transition: border-color 0.2s;
        }
        select:focus, input:focus { border-color: var(--accent-color); }

        .drop-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 25px;
            text-align: center; color: var(--text-muted); cursor: pointer; transition: all 0.2s; margin-bottom: 20px;
        }
        .drop-zone.dragover { border-color: var(--accent-color); color: var(--accent-hover); background: rgba(59, 130, 246, 0.05); }

        textarea {
            width: 100%; height: 160px; background: #0a0b0e; border: 1px solid var(--border);
            color: #e2e8f0; padding: 15px; font-size: 15px; line-height: 1.6; border-radius: 8px; resize: none;
        }
        
        button.primary {
            width: 100%; padding: 16px; margin-top: 15px; background: var(--accent-color); color: #fff;
            border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }
        button.primary:hover { background: var(--accent-hover); }

        #bookmark-alert {
            display: none; background: rgba(59,130,246,0.1); border: 1px solid var(--accent-color);
            padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center;
        }
        #btn-resume-bookmark {
            width: 100%; padding: 10px; margin-top: 10px; background: var(--accent-color); color: white; 
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        #btn-resume-bookmark:hover { background: var(--accent-hover); }

        /* --- Original Text Context Underlay --- */
        #context-layer {
            position: absolute; right: 0; top: 0; width: 45%; height: 100%;
            padding: 10vh 5%; overflow-y: auto; overflow-x: hidden; pointer-events: none;
            white-space: pre-wrap; font-family: var(--font-read); font-size: 1.1rem; line-height: 2.0;
            color: rgba(255, 255, 255, var(--context-opacity, 0.20));
            z-index: 1; text-align: left; display: none;
            scrollbar-width: none; 
        }
        #context-layer::-webkit-scrollbar { display: none; }
        #context-layer.active { display: block; }
        #context-layer span { transition: color 0.1s, font-weight 0.1s; }
        #context-layer span.active-word { color: var(--accent-color); font-weight: 800; text-shadow: 0 0 10px rgba(59,130,246,0.6); }

        /* --- Structure Sidebar --- */
        #sidebar {
            position: fixed; top: 0; left: -320px; width: 320px; height: 100%;
            background: var(--ui-card); border-right: 1px solid var(--border);
            z-index: 100; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        #sidebar.open { left: 0; }
        .sidebar-header {
            padding: 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; background: #0a0b0e;
        }
        .sidebar-header h3 { font-size: 1rem; font-weight: 600; color: white; text-transform: uppercase; letter-spacing: 1px; }
        .close-btn { background: transparent; border: none; color: #888; font-size: 1.5rem; cursor: pointer; padding: 0 5px; }
        .close-btn:hover { color: var(--pivot-color); }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 10px 0; overflow-x: hidden; }
        
        .struct-item {
            padding: 12px 20px; border-bottom: 1px solid #1a1c23; cursor: pointer; color: #aaa;
            font-size: 0.85rem; line-height: 1.4; white-space: nowrap; overflow: hidden;
            border-left: 3px solid transparent; transition: background 0.2s, color 0.2s;
        }
        .struct-item:hover { background: rgba(59, 130, 246, 0.1); color: white; border-left: 3px solid var(--accent-color); }
        .marquee-text { display: inline-block; pointer-events: none; }

        /* --- Reader Stage --- */
        .rsvp-stage {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline;
            width: 100%; max-width: 90vw; user-select: none; z-index: 10;
        }
        .word-chunk { font-family: var(--font-read); font-size: 6rem; white-space: pre; line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        .c-left { text-align: right; color: var(--text-muted); justify-self: end; overflow: hidden; max-width: 45vw; }
        .c-right { text-align: left; color: var(--text-muted); justify-self: start; overflow: hidden; max-width: 45vw; }
        .c-pivot { color: var(--pivot-color); font-weight: 700; text-align: center; position: relative; z-index: 10; }

        .c-pivot:not(.is-num)::before, .c-pivot:not(.is-num)::after {
            content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 2px; height: 18px; background: #333;
        }
        .c-pivot:not(.is-num)::before { top: -35px; }
        .c-pivot:not(.is-num)::after { bottom: -35px; }
        .c-pivot.is-num { color: #fff; font-weight: 400; }

        /* --- HUD & Skip Toast --- */
        .hud { position: absolute; bottom: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; transition: opacity 0.5s ease; z-index: 20; }
        .hud-top-row { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 30px; border: 1px solid var(--border); backdrop-filter: blur(5px); flex-wrap: wrap; justify-content: center; }
        
        .jump-control { display: flex; align-items: center; gap: 8px; font-family: var(--font-read); font-size: 0.9rem; color: #888; }
        .jump-control input { width: 70px; padding: 6px; text-align: center; font-family: var(--font-read); border-radius: 4px; background: #111; font-size: 0.9rem; }
        .jump-control button { padding: 6px 12px; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; background: #222; border-radius: 4px; cursor: pointer; }
        .jump-control button:hover { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        
        .hud-select { padding: 6px 10px; font-size: 0.85rem; border-radius: 6px; background: #111; max-width: 150px; }
        .hud-controls { display: flex; gap: 15px; }
        
        button.hud-btn {
            background: rgba(0,0,0,0.5); border: 1px solid #444; color: #aaa; padding: 12px 30px;
            border-radius: 30px; cursor: pointer; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; backdrop-filter: blur(5px); transition: 0.2s;
        }
        button.hud-btn:hover { border-color: white; color: white; }
        button.hud-btn.active { border-color: var(--accent-color); color: var(--accent-color); }

        #skip-toast {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            font-size: 3rem; font-weight: 800; color: var(--accent-color); opacity: 0; pointer-events: none;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: all 0.15s ease-out; z-index: 30;
        }
        #skip-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

    </style>
</head>
<body>

    <!-- SETTINGS INTERFACE -->
    <div id="layer-input" class="layer">
        <div class="card" id="main-card">
            <h1>Read<span>Sync</span></h1>
            
            <div id="bookmark-alert">
                <p style="color:white; margin-bottom:5px; font-weight:600;">Saved Session Found</p>
                <button id="btn-resume-bookmark">Resume Where You Left Off</button>
            </div>

            <div class="drop-zone" id="drop-zone">
                Drag & Drop Document Here (PDF, DOCX, EPUB, TXT)
                <br><span style="font-size:0.8rem; opacity:0.6;">Or click to browse</span>
                <input type="file" id="file-upload" accept=".pdf,.docx,.epub,.txt" style="display:none;">
            </div>

            <div class="grid-2">
                <div class="field">
                    <label>Synthesis Engine</label>
                    <select id="sel-voice"><option value="EDGE_AI">Edge AI (Local LLM Placeholder)</option></select>
                </div>
                <div class="field">
                    <label>Pacing Rate</label>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="range" id="rng-rate" min="0.5" max="2.5" step="0.1" value="1.0" style="flex-grow:1;">
                        <span id="disp-rate" style="font-size:0.85rem; width:25px; color:#aaa;">1.0</span>
                    </div>
                </div>
            </div>

            <textarea id="txt-input" placeholder="Extracted text will appear here. Or paste your own content manually."></textarea>
            <div style="text-align:right; font-size:0.7rem; color:#555; margin-top:5px;"><span id="cnt-char">0</span> chars</div>

            <button id="btn-start" class="primary">Initiate Synced Stream</button>
        </div>
    </div>

    <!-- RSVP READER INTERFACE -->
    <div id="layer-reader" class="layer hidden">
        
        <div id="skip-toast">+5 Words</div>
        
        <!-- Original Text Context Layer -->
        <div id="context-layer"></div>

        <!-- Collapsible Structure Sidebar -->
        <div id="sidebar">
            <div class="sidebar-header">
                <h3>Document Structure</h3>
                <button id="btn-close-sidebar" class="close-btn">&times;</button>
            </div>
            <div class="sidebar-content" id="sidebar-content"></div>
        </div>

        <div class="rsvp-stage">
            <div class="word-chunk c-left" id="r-left"></div>
            <div class="word-chunk c-pivot" id="r-pivot"></div>
            <div class="word-chunk c-right" id="r-right"></div>
        </div>
        
        <div class="hud">
            <!-- Navigation & Context Controls -->
            <div class="hud-top-row">
                <button id="btn-toggle-sidebar" class="hud-btn" style="padding:6px 12px; font-size:1.2rem;" title="Contents">☰</button>
                <div class="jump-control">
                    Word <input type="number" id="inp-jump" min="1" value="1"> / <span id="hud-total">0</span>
                    <button id="btn-jump">Go</button>
                </div>
                
                <!-- Underlay Toggles -->
                <div style="display:flex; align-items:center; gap:8px; border-left: 1px solid #333; padding-left:15px; margin-left:5px;">
                    <button id="btn-toggle-context" class="hud-btn" style="padding:6px 10px; font-size:0.8rem;">👁 Context</button>
                    <input type="range" id="rng-opacity" min="0.05" max="0.8" step="0.05" value="0.2" title="Underlay Opacity" style="width: 80px;">
                </div>

                <select id="sel-hud-voice" class="hud-select" title="Change Voice On-the-Fly"></select>
                <button id="btn-fullscreen" class="hud-btn" style="padding:6px 12px; font-size:1.2rem;" title="Zen Fullscreen">⛶</button>
            </div>

            <div class="hud-controls">
                <button id="btn-pause" class="hud-btn">Pause</button>
                <button id="btn-bookmark" class="hud-btn">Bookmark & Exit</button>
                <button id="btn-stop" class="hud-btn" style="border-color:var(--pivot-color); color:var(--pivot-color);">Stop</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ReadSync | Enterprise Architecture
         * Added Fix: TTS Ghost-Event Mutex Isolation & Perfect Clause Slicing
         */

        if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const UI = {
            layers: { input: document.getElementById('layer-input'), reader: document.getElementById('layer-reader') },
            in: {
                dropZone: document.getElementById('drop-zone'), fileInput: document.getElementById('file-upload'),
                voice: document.getElementById('sel-voice'), rate: document.getElementById('rng-rate'), rateDisp: document.getElementById('disp-rate'),
                text: document.getElementById('txt-input'), count: document.getElementById('cnt-char'), start: document.getElementById('btn-start'),
                bookmarkAlert: document.getElementById('bookmark-alert'), btnResumeBookmark: document.getElementById('btn-resume-bookmark')
            },
            out: {
                left: document.getElementById('r-left'), pivot: document.getElementById('r-pivot'), right: document.getElementById('r-right'),
                pause: document.getElementById('btn-pause'), bookmark: document.getElementById('btn-bookmark'), stop: document.getElementById('btn-stop'),
                jumpInp: document.getElementById('inp-jump'), jumpBtn: document.getElementById('btn-jump'), totalWords: document.getElementById('hud-total'),
                hudVoice: document.getElementById('sel-hud-voice'), btnFullscreen: document.getElementById('btn-fullscreen'),
                sidebar: document.getElementById('sidebar'), btnToggleSidebar: document.getElementById('btn-toggle-sidebar'), btnCloseSidebar: document.getElementById('btn-close-sidebar'), sidebarContent: document.getElementById('sidebar-content'),
                contextLayer: document.getElementById('context-layer'), btnToggleContext: document.getElementById('btn-toggle-context'), rngOpacity: document.getElementById('rng-opacity'), skipToast: document.getElementById('skip-toast')
            }
        };

        const STATE = {
            rawText: '', 
            voices: [],
            activeEngine: null,
            pipelineData: null,
            currentWordGlobalIndex: 0,
            isPaused: false,
            lastContextSpan: null
        };

        let zenIdleTimer = null;
        let skipStreak = 0;
        let lastSkipTime = 0;
        let skipDirection = 0;

        window.addEventListener('load', () => {
            initVoiceLoader();
            bindGlobalDragEvents();
            bindUIEvents();
            StorageManager.checkBookmark();
        });

        // --- Persistent Storage Manager ---
        const StorageManager = {
            saveBookmark() {
                if(!STATE.pipelineData) return;
                const data = { 
                    text: UI.in.text.value, 
                    wordIdx: STATE.currentWordGlobalIndex, 
                    rate: UI.in.rate.value, 
                    voice: UI.in.voice.value 
                };
                localStorage.setItem('ReadSync_Save', JSON.stringify(data));
                alert("Session Bookmarked! You can resume from this exact word later.");
            },
            checkBookmark() {
                if(localStorage.getItem('ReadSync_Save')) UI.in.bookmarkAlert.style.display = 'block';
                else UI.in.bookmarkAlert.style.display = 'none';
            },
            loadBookmark() {
                const data = JSON.parse(localStorage.getItem('ReadSync_Save'));
                if(!data) return;
                UI.in.text.value = data.text;
                UI.in.count.innerText = data.text.length;
                UI.in.rate.value = data.rate; 
                UI.in.rateDisp.innerText = data.rate;
                UI.in.voice.value = data.voice;
                
                UI.in.bookmarkAlert.style.display = 'none';
                startSequence(data.wordIdx); // startSequence inherently calls jumpTo(x, true)
            }
        };

        // --- Keyboard Controls & Zen Mode ---
        window.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if(e.code === 'Space') {
                e.preventDefault();
                if(STATE.activeEngine && !UI.layers.reader.classList.contains('hidden')) togglePause();
            }

            if((e.code === 'ArrowRight' || e.code === 'ArrowLeft') && STATE.activeEngine && !UI.layers.reader.classList.contains('hidden')) {
                e.preventDefault();
                const now = Date.now();
                const dir = e.code === 'ArrowRight' ? 1 : -1;

                if (now - lastSkipTime < 600 && skipDirection === dir) skipStreak++;
                else { skipStreak = 1; skipDirection = dir; }
                lastSkipTime = now;

                const wordsToSkip = Math.min(5 * skipStreak, 100);
                let targetIdx = STATE.currentWordGlobalIndex + (wordsToSkip * dir);
                targetIdx = Math.max(0, Math.min(targetIdx, STATE.pipelineData.totalWords - 1));

                UI.out.skipToast.innerText = `${dir === 1 ? '+' : '-'}${wordsToSkip} Words`;
                UI.out.skipToast.classList.add('show');
                clearTimeout(UI.out.skipToast.timer);
                UI.out.skipToast.timer = setTimeout(() => UI.out.skipToast.classList.remove('show'), 600);

                // Auto-resume if it was already playing, otherwise stay paused.
                const wasPlaying = !STATE.isPaused;
                STATE.activeEngine.jumpTo(targetIdx, wasPlaying);
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) startZenIdleTimer();
            else { clearTimeout(zenIdleTimer); document.body.classList.remove('zen-idle'); }
        });
        document.addEventListener('mousemove', () => {
            if (document.fullscreenElement) { document.body.classList.remove('zen-idle'); startZenIdleTimer(); }
        });
        function startZenIdleTimer() {
            clearTimeout(zenIdleTimer);
            zenIdleTimer = setTimeout(() => {
                if(document.fullscreenElement && STATE.activeEngine && !STATE.isPaused) document.body.classList.add('zen-idle');
            }, 2500);
        }

        // --- File Routing ---
        function bindGlobalDragEvents() {
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                window.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });
            function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
            UI.in.dropZone.addEventListener('drop', (e) => {
                UI.in.dropZone.classList.remove('dragover');
                if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
            UI.in.dropZone.addEventListener('click', () => UI.in.fileInput.click());
            UI.in.fileInput.addEventListener('change', (e) => { if(e.target.files.length) handleFile(e.target.files[0]); });
        }

        async function handleFile(file) {
            UI.in.dropZone.innerHTML = `Extracting <span style="color:var(--accent-color)">${file.name}</span>...`;
            let text = '';
            try {
                const ext = file.name.split('.').pop().toLowerCase();
                if (ext === 'txt') text = await file.text();
                else if (ext === 'pdf') {
                    const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    for(let i=1; i<=pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        text += (await page.getTextContent()).items.map(it => it.str).join(' ') + '\n\n';
                    }
                } else if (ext === 'docx') text = (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
                else if (ext === 'epub') {
                    const zip = await JSZip.loadAsync(file);
                    for (const filename of Object.keys(zip.files)) {
                        if (filename.match(/\.(html|xhtml|htm)$/i)) {
                            const doc = new DOMParser().parseFromString(await zip.files[filename].async('string'), 'text/html');
                            text += doc.body.textContent + '\n\n';
                        }
                    }
                } else throw new Error('Format');
                
                UI.in.text.value = text.trim();
                UI.in.count.innerText = UI.in.text.value.length;
            } catch (error) { alert("Extraction failed. Unsupported or protected format."); }
            UI.in.dropZone.innerHTML = "Drag & Drop Document Here (PDF, DOCX, EPUB, TXT)<br><span style='font-size:0.8rem; opacity:0.6;'>Or click to browse</span>";
        }

        // --- Voice Loader ---
        function initVoiceLoader() {
            const loadNative = () => {
                let voices = window.speechSynthesis.getVoices();
                if(voices.length === 0) return; 
                STATE.voices = voices.sort((a,b) => (b.name.includes('Google')||b.name.includes('Natural')) - (a.name.includes('Google')||a.name.includes('Natural')));
                const buildOptions = () => {
                    let html = '<optgroup label="Edge Pipeline"><option value="EDGE_AI">Edge AI (Local LLM Placeholder)</option></optgroup>';
                    html += '<optgroup label="Native System Voices">';
                    STATE.voices.forEach((v, i) => { html += `<option value="${i}" ${i===0?'selected':''}>${(v.name.includes('Google') || v.name.includes('Natural')) ? '★ ' : ''}${v.name}</option>`; });
                    html += '</optgroup>';
                    return html;
                };
                UI.in.voice.innerHTML = buildOptions();
                UI.out.hudVoice.innerHTML = buildOptions();
            };
            loadNative();
            if(window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = loadNative;
        }

        function bindUIEvents() {
            UI.in.rate.addEventListener('input', e => UI.in.rateDisp.innerText = parseFloat(e.target.value).toFixed(1));
            UI.in.text.addEventListener('input', e => UI.in.count.innerText = e.target.value.length);
            UI.in.start.addEventListener('click', () => startSequence(0));
            UI.in.btnResumeBookmark.addEventListener('click', () => StorageManager.loadBookmark());

            UI.out.pause.addEventListener('click', togglePause);
            UI.out.stop.addEventListener('click', stopSequence);
            UI.out.bookmark.addEventListener('click', () => { StorageManager.saveBookmark(); stopSequence(); });

            UI.out.btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
                else document.exitFullscreen();
            });

            UI.out.btnToggleSidebar.addEventListener('click', () => UI.out.sidebar.classList.toggle('open'));
            UI.out.btnCloseSidebar.addEventListener('click', () => UI.out.sidebar.classList.remove('open'));

            UI.out.jumpBtn.addEventListener('click', handleJumpInput);
            UI.out.jumpInp.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleJumpInput(); });

            UI.out.btnToggleContext.addEventListener('click', () => {
                UI.out.contextLayer.classList.toggle('active');
                UI.out.btnToggleContext.classList.toggle('active');
                
                if(UI.out.contextLayer.classList.contains('active') && STATE.lastContextSpan) {
                    const container = UI.out.contextLayer;
                    const spanTop = STATE.lastContextSpan.offsetTop;
                    const containerHalf = container.clientHeight / 2;
                    const spanHalf = STATE.lastContextSpan.clientHeight / 2;
                    container.scrollTo({ top: spanTop - containerHalf + spanHalf, behavior: 'auto' });
                }
            });
            UI.out.rngOpacity.addEventListener('input', (e) => { document.documentElement.style.setProperty('--context-opacity', e.target.value); });

            UI.out.hudVoice.addEventListener('change', (e) => {
                if(!STATE.activeEngine) return;
                const vVal = e.target.value;
                const isEdge = (vVal === 'EDGE_AI');
                STATE.activeEngine.changeVoice(isEdge ? null : parseInt(vVal), isEdge);
                
                // Force a jump to current word to cleanly instantiate the new voice mid-stream
                STATE.activeEngine.jumpTo(STATE.currentWordGlobalIndex, !STATE.isPaused);
            });
        }

        function handleJumpInput() {
            if(!STATE.activeEngine) return;
            let target = parseInt(UI.out.jumpInp.value) - 1; 
            if(isNaN(target)) return;
            target = Math.max(0, Math.min(target, STATE.pipelineData.totalWords - 1));
            // User requested that manually using 'Go' button explicitly pauses the stream.
            STATE.activeEngine.jumpTo(target, false);
        }

        // --- Text Pipeline (Dual-Index Lexer w/ Hyphen Parsing) ---
        class TextPipeline {
            static parse(rawText) {
                const clauses = [];
                const structure = [];
                let globalIdx = 0;
                
                const wordRegex = /[^\s\-—–]+/g; 
                let match;
                let currentClauseWords = [];
                let currentClauseStart = 0;
                let lastWordEnd = 0;
                let nextSegmentThreshold = 0;

                while ((match = wordRegex.exec(rawText)) !== null) {
                    const rawWord = match[0];
                    const cleanWord = rawWord.replace(/[.,;:"!?)(\]\[}]/g, '');
                    const charStart = match.index;
                    const charEnd = charStart + rawWord.length;

                    const textSinceLast = rawText.substring(lastWordEnd, charStart);
                    const prevWordRaw = currentClauseWords.length > 0 ? currentClauseWords[currentClauseWords.length - 1].raw : '';

                    if (currentClauseWords.length > 0 && (/[.,!?;:]$/.test(prevWordRaw) || /[\n\r]/.test(textSinceLast))) {
                        const clauseText = rawText.substring(currentClauseStart, charStart);
                        
                        const cleanClause = clauseText.trim();
                        if (cleanClause) {
                            const isChapter = /^(chapter|section|part)\s+\d+/i.test(cleanClause);
                            const isShortUpper = cleanClause.length < 60 && cleanClause === cleanClause.toUpperCase() && /[A-Z]/.test(cleanClause);
                            const firstWordIdx = currentClauseWords[0].globalIdx;

                            if (isChapter || isShortUpper || firstWordIdx === 0 || firstWordIdx >= nextSegmentThreshold) {
                                const firstW = currentClauseWords[0];
                                const lastW = currentClauseWords[Math.min(19, currentClauseWords.length - 1)];
                                const titleText = rawText.substring(firstW.charStart, lastW.charEnd);
                                structure.push({ title: titleText + (currentClauseWords.length > 20 ? '...' : ''), wordIdx: firstWordIdx });
                                nextSegmentThreshold = firstWordIdx + 400; 
                            }
                        }

                        currentClauseWords.forEach(w => {
                            w.clauseCharStart = w.charStart - currentClauseStart;
                            w.clauseCharEnd = w.charEnd - currentClauseStart;
                        });

                        clauses.push({ text: clauseText, words: currentClauseWords });
                        currentClauseWords = [];
                        currentClauseStart = charStart; 
                    }

                    if (cleanWord.length > 0) {
                        currentClauseWords.push({ raw: rawWord, clean: cleanWord, charStart, charEnd, globalIdx: globalIdx++ });
                    }
                    lastWordEnd = charEnd;
                }
                
                if (currentClauseWords.length > 0) {
                    const clauseText = rawText.substring(currentClauseStart);
                    currentClauseWords.forEach(w => {
                        w.clauseCharStart = w.charStart - currentClauseStart;
                        w.clauseCharEnd = w.charEnd - currentClauseStart;
                    });
                    clauses.push({ text: clauseText, words: currentClauseWords });
                }

                return { clauses, totalWords: globalIdx, structure };
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        function buildContextLayer(rawText, pipelineData) {
            let html = '';
            let lastIdx = 0;
            const allWords = pipelineData.clauses.flatMap(c => c.words);
            
            for (let w of allWords) {
                html += escapeHTML(rawText.substring(lastIdx, w.charStart));
                html += `<span id="uw-${w.globalIdx}">${escapeHTML(rawText.substring(w.charStart, w.charEnd))}</span>`;
                lastIdx = w.charEnd;
            }
            html += escapeHTML(rawText.substring(lastIdx));
            UI.out.contextLayer.innerHTML = html;
        }

        function buildSidebar() {
            UI.out.sidebarContent.innerHTML = '';
            STATE.pipelineData.structure.forEach(item => {
                const div = document.createElement('div');
                div.className = 'struct-item';
                
                const textSpan = document.createElement('span');
                textSpan.className = 'marquee-text';
                textSpan.innerText = item.title;
                div.appendChild(textSpan);
                
                div.onmouseenter = () => {
                    const visibleWidth = div.clientWidth - 40; 
                    if (textSpan.scrollWidth > visibleWidth) {
                        const distance = textSpan.scrollWidth - visibleWidth;
                        textSpan.style.transition = `transform ${distance * 0.015}s linear 0.2s`; 
                        textSpan.style.transform = `translateX(-${distance}px)`;
                    }
                };
                div.onmouseleave = () => {
                    textSpan.style.transition = `transform 0.3s ease`;
                    textSpan.style.transform = `translateX(0)`;
                };

                div.onclick = () => { UI.out.jumpInp.value = item.wordIdx + 1; handleJumpInput(); UI.out.sidebar.classList.remove('open'); };
                UI.out.sidebarContent.appendChild(div);
            });
        }

        function renderWord(wordObj) {
            if (!wordObj) return;
            STATE.currentWordGlobalIndex = wordObj.globalIdx;
            
            if(document.activeElement !== UI.out.jumpInp) UI.out.jumpInp.value = wordObj.globalIdx + 1;

            const contextSpan = document.getElementById(`uw-${wordObj.globalIdx}`);
            if(contextSpan) {
                if(STATE.lastContextSpan) STATE.lastContextSpan.classList.remove('active-word');
                contextSpan.classList.add('active-word');
                STATE.lastContextSpan = contextSpan;

                if (UI.out.contextLayer.classList.contains('active')) {
                    const container = UI.out.contextLayer;
                    const spanTop = contextSpan.offsetTop;
                    const containerHalf = container.clientHeight / 2;
                    const spanHalf = contextSpan.clientHeight / 2;
                    container.scrollTo({ top: spanTop - containerHalf + spanHalf, behavior: 'auto' });
                }
            }

            const displayToken = wordObj.clean;
            if (!displayToken) return; 

            if (/^\d+$/.test(displayToken)) {
                UI.out.left.innerText = ''; UI.out.right.innerText = '';
                UI.out.pivot.innerText = displayToken; UI.out.pivot.classList.add('is-num'); return;
            }

            UI.out.pivot.classList.remove('is-num');
            const len = displayToken.length;
            let idx = Math.max(0, Math.ceil(len / 2) - 1); 
            const center = Math.floor(len / 2);
            for (let d = 0; d < len; d++) {
                if (center - d > 0 && /[aeiouy]/i.test(displayToken[center - d])) { idx = center - d; break; }
                if (center + d < len - 1 && d > 0 && /[aeiouy]/i.test(displayToken[center + d])) { idx = center + d; break; }
            }

            UI.out.left.innerText = displayToken.substring(0, idx);
            UI.out.pivot.innerText = displayToken[idx];
            UI.out.right.innerText = displayToken.substring(idx + 1);
        }

        // --- STRICT MUTEX ENGINE ---
        class StrictSyncEngine {
            constructor(pipelineData, voiceIndex, rate, isEdgePlaceholder = false) {
                this.clauses = pipelineData.clauses;
                this.voiceIndex = voiceIndex;
                this.rate = rate;
                this.isEdge = isEdgePlaceholder;
                this.currentClauseIdx = 0;
                this.isActive = false;
                this.timer = null;
                this.engineSupportsBoundaries = false; 
                this.expectedUtt = null; // Ghost Event Mutex Lock
                this.resumeGlobalIdx = null; // Internal queue for pausing states
            }

            start(startWordIdx = 0) {
                this.isActive = true;
                this.jumpTo(startWordIdx, true); 
            }

            jumpTo(globalWordIdx, autoPlay = false) {
                // 1. Completely destroy ghost events and old timers
                this.expectedUtt = null; 
                window.speechSynthesis.cancel();
                if(this.timer) clearInterval(this.timer);
                this.engineSupportsBoundaries = false; 

                // 2. Locate absolute positional context
                this.currentClauseIdx = Math.max(0, this.clauses.findIndex(c => c.words.some(w => w.globalIdx >= globalWordIdx)));
                this.resumeGlobalIdx = globalWordIdx;

                // 3. Render target word visibly immediately
                if(this.clauses[this.currentClauseIdx]) {
                    const targetWord = this.clauses[this.currentClauseIdx].words.find(w => w.globalIdx >= globalWordIdx) || this.clauses[this.currentClauseIdx].words[0];
                    renderWord(targetWord);
                }

                // 4. Either sit paused in flushed state, or instantly play from slice
                if (autoPlay) {
                    STATE.isPaused = false;
                    UI.out.pause.innerText = "Pause"; 
                    UI.out.pause.classList.remove('active');
                    this.playClause(this.resumeGlobalIdx);
                    this.resumeGlobalIdx = null;
                } else {
                    STATE.isPaused = true;
                    UI.out.pause.innerText = "Resume"; 
                    UI.out.pause.classList.add('active');
                }
            }

            changeVoice(voiceIndex, isEdge) { this.voiceIndex = voiceIndex; this.isEdge = isEdge; }

            playClause(startAtGlobalIdx = null) {
                if (!this.isActive || STATE.isPaused) return;
                if (this.currentClauseIdx >= this.clauses.length) return stopSequence();

                const clause = this.clauses[this.currentClauseIdx];
                let currentVisualIdx = 0;
                let charOffset = 0; // The slice delimiter

                // Calculate mid-clause jumping parameters
                if(startAtGlobalIdx !== null) {
                    currentVisualIdx = clause.words.findIndex(w => w.globalIdx >= startAtGlobalIdx);
                    if(currentVisualIdx === -1) currentVisualIdx = 0;
                }

                let textToSpeak = clause.text;
                if (currentVisualIdx > 0) {
                    const startWord = clause.words[currentVisualIdx];
                    charOffset = startWord.clauseCharStart;
                    textToSpeak = clause.text.substring(charOffset);
                }

                const audioText = textToSpeak.replace(/[-—–]/g, ' ');
                const utt = new SpeechSynthesisUtterance(audioText);
                this.expectedUtt = utt; // Apply Mutex
                
                if (!this.isEdge && STATE.voices[this.voiceIndex]) utt.voice = STATE.voices[this.voiceIndex];
                utt.rate = this.rate;

                const msPerWord = 60000 / (260 * this.rate);

                utt.onstart = () => {
                    if (this.expectedUtt !== utt) return; // Ghost Check
                    renderWord(clause.words[currentVisualIdx]);
                    if(this.timer) clearInterval(this.timer);
                    
                    if (!this.engineSupportsBoundaries || this.isEdge) {
                        this.timer = setInterval(() => {
                            if(STATE.isPaused) return;
                            if(currentVisualIdx + 1 < clause.words.length) {
                                currentVisualIdx++;
                                renderWord(clause.words[currentVisualIdx]);
                            }
                        }, msPerWord);
                    }
                };

                utt.onboundary = (e) => {
                    if (this.expectedUtt !== utt) return; // Ghost Check
                    if (e.name === 'word') {
                        if (!this.engineSupportsBoundaries) {
                            this.engineSupportsBoundaries = true;
                            if(this.timer) clearInterval(this.timer);
                        }
                        
                        // Add slice offset to mathematically restore index validity to original clause
                        const adjustedCharIndex = e.charIndex + charOffset;
                        
                        let exactIdx = currentVisualIdx;
                        for (let i = currentVisualIdx; i < clause.words.length; i++) {
                            if (adjustedCharIndex >= (clause.words[i].clauseCharStart - 2)) exactIdx = i;
                            else break;
                        }
                        
                        if (exactIdx > currentVisualIdx) {
                            currentVisualIdx = exactIdx;
                            renderWord(clause.words[currentVisualIdx]);
                        }
                    }
                };

                utt.onend = () => {
                    if (this.expectedUtt !== utt) return; // Ghost Check
                    if(this.timer) clearInterval(this.timer);
                    
                    const advanceClause = () => {
                        this.currentClauseIdx++;
                        if(this.isActive && !STATE.isPaused) this.playClause();
                    };

                    // Forced Flush to correct for missing boundary events
                    if (currentVisualIdx < clause.words.length - 1) {
                        currentVisualIdx = clause.words.length - 1;
                        renderWord(clause.words[currentVisualIdx]);
                        setTimeout(advanceClause, 150); 
                    } else {
                        advanceClause();
                    }
                };

                window.speechSynthesis.speak(utt);
            }

            pause() { 
                window.speechSynthesis.pause(); 
            }
            
            resume() { 
                window.speechSynthesis.resume(); 
                if(!window.speechSynthesis.speaking) {
                    // Browser forcefully dumped utterance context when paused, completely reconstruct it.
                    let startIdx = this.resumeGlobalIdx !== null ? this.resumeGlobalIdx : STATE.currentWordGlobalIndex;
                    this.resumeGlobalIdx = null; 
                    this.playClause(startIdx); 
                }
            }
            
            stop() { 
                this.isActive = false; 
                this.expectedUtt = null;
                if(this.timer) clearInterval(this.timer); 
                window.speechSynthesis.cancel(); 
            }
        }

        // --- Application Control ---
        function togglePause() {
            STATE.isPaused = !STATE.isPaused;
            if (STATE.isPaused) {
                UI.out.pause.innerText = "Resume"; UI.out.pause.classList.add('active');
                if(STATE.activeEngine) STATE.activeEngine.pause();
            } else {
                UI.out.pause.innerText = "Pause"; UI.out.pause.classList.remove('active');
                if(STATE.activeEngine) STATE.activeEngine.resume();
            }
        }

        function startSequence(startWordIdx = 0) {
            STATE.rawText = UI.in.text.value; 
            if (!STATE.rawText.trim()) return alert("No text input found.");

            STATE.pipelineData = TextPipeline.parse(STATE.rawText);
            if(STATE.pipelineData.totalWords === 0) return alert("No words extracted.");

            UI.out.totalWords.innerText = STATE.pipelineData.totalWords;
            buildSidebar(); 
            buildContextLayer(STATE.rawText, STATE.pipelineData);

            UI.layers.input.classList.add('hidden');
            UI.layers.reader.classList.remove('hidden');

            const rate = parseFloat(UI.in.rate.value);
            const vVal = UI.in.voice.value;
            UI.out.hudVoice.value = vVal; 

            window.speechSynthesis.cancel(); 

            const isEdge = (vVal === 'EDGE_AI');
            STATE.activeEngine = new StrictSyncEngine(STATE.pipelineData, isEdge ? null : parseInt(vVal), rate, isEdge);
            // The jumpTo logic internally controls auto-play and states
            STATE.activeEngine.start(startWordIdx);
        }

        function stopSequence() {
            if (STATE.activeEngine) STATE.activeEngine.stop();
            STATE.activeEngine = null; STATE.isPaused = false;
            if (document.fullscreenElement) document.exitFullscreen();
            
            UI.layers.reader.classList.add('hidden');
            UI.layers.input.classList.remove('hidden');
            UI.out.sidebar.classList.remove('open');
            UI.out.contextLayer.classList.remove('active');
            UI.out.btnToggleContext.classList.remove('active');
            UI.out.left.innerText = ''; UI.out.pivot.innerText = ''; UI.out.right.innerText = '';
            
            StorageManager.checkBookmark(); 
        }
    </script>
</body>
