<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadSync | Enterprise HD Stream</title>
    
    <!-- Enterprise CDNs for Multi-Format File Ingestion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #030305;
            --text-main: #f1f1f1;
            --text-muted: #666;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --pivot-color: #ef4444; 
            --ui-bg: #0f1115;
            --ui-card: #16181d;
            --border: #262933;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-read: 'Courier New', Courier, monospace; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-ui); }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Transitions & Layers --- */
        .layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }

        /* --- UI Card --- */
        .card {
            width: 90%;
            max-width: 800px;
            background: var(--ui-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            max-height: 95vh;
            overflow-y: auto;
        }

        h1 {
            font-weight: 300;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 25px;
            color: white;
            font-size: 2rem;
        }
        h1 span { color: var(--accent-color); font-weight: 600; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

        .field { display: flex; flex-direction: column; gap: 8px; }

        label { 
            font-size: 0.75rem; 
            color: #999; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 600;
        }

        select, input[type="range"], input[type="text"], button {
            background: #0a0b0e;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input[type="text"]:focus { border-color: var(--accent-color); }

        /* --- Drop Zone --- */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.02);
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-color);
            background: rgba(59, 130, 246, 0.05);
            color: var(--accent-hover);
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #0a0b0e;
            border: 1px solid var(--border);
            color: #e2e8f0;
            padding: 15px;
            font-size: 15px;
            line-height: 1.6;
            border-radius: 8px;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: var(--accent-color); }

        button.primary {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button.primary:hover { background: var(--accent-hover); }

        /* --- Edge AI Panel --- */
        #edge-panel {
            background: #0a0b0e; border: 1px solid var(--accent-color);
            padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none;
        }
        .edge-active #edge-panel { display: block; }
        .edge-btn {
            background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); cursor: pointer; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold;
        }
        .edge-btn:hover { background: rgba(59, 130, 246, 0.1); }

        /* --- Reader Stage --- */
        .rsvp-stage {
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: baseline;
            width: 100%;
            max-width: 90vw;
            user-select: none;
        }

        .word-chunk {
            font-family: var(--font-read);
            font-size: 5.5rem; 
            white-space: pre; 
            line-height: 1;
        }

        .c-left { text-align: right; color: var(--text-muted); justify-self: end; overflow: hidden; max-width: 45vw; }
        .c-right { text-align: left; color: var(--text-muted); justify-self: start; overflow: hidden; max-width: 45vw; }
        .c-pivot {
            color: var(--pivot-color);
            font-weight: 700;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .c-pivot:not(.is-num)::before, .c-pivot:not(.is-num)::after {
            content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 2px; height: 18px; background: #333;
        }
        .c-pivot:not(.is-num)::before { top: -30px; }
        .c-pivot:not(.is-num)::after { bottom: -30px; }

        .c-pivot.is-num { color: #fff; font-weight: 400; }

        .hud { position: absolute; bottom: 60px; }
        button.stop-btn {
            background: transparent; border: 1px solid #444; color: #888; padding: 12px 40px; border-radius: 30px; cursor: pointer; text-transform: uppercase; font-weight: 600; letter-spacing: 1px;
        }
        button.stop-btn:hover { border-color: #ef4444; color: #ef4444; }

    </style>
</head>
<body>

    <!-- SETTINGS INTERFACE -->
    <div id="layer-input" class="layer">
        <div class="card" id="main-card">
            <h1>Read<span>Sync</span></h1>
            
            <div class="drop-zone" id="drop-zone">
                Drag & Drop Document (PDF, DOCX, EPUB) or Click to Browse
                <input type="file" id="file-upload" accept=".pdf,.docx,.epub,.txt" style="display:none;">
            </div>

            <div class="grid-2">
                <div class="field">
                    <label>Synthesis Engine / Voice</label>
                    <select id="sel-voice"><option>Loading Neural Engines...</option></select>
                </div>
                <div class="field">
                    <label>Pacing (Rate)</label>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="range" id="rng-rate" min="0.5" max="2.5" step="0.1" value="1.0" style="flex-grow:1;">
                        <span id="disp-rate" style="font-size:0.85rem; width:25px; color:#aaa;">1.0</span>
                    </div>
                </div>
            </div>

            <!-- EDGE AI CONFIGURATION PANEL -->
            <div id="edge-panel">
                <label style="color:var(--text-main); margin-bottom:10px; display:block;">Edge Compute Configuration</label>
                <div class="grid-2">
                    <button id="btn-local-file" class="edge-btn">Map Local LLM Filepath</button>
                    <input type="text" id="inp-edge-api" placeholder="Or Local API (e.g., http://127.0.0.1:8080/tts)">
                </div>
                <div id="disp-local-path" style="font-size:0.7rem; color:#888; margin-top:8px; font-family:var(--font-read);">No local weights mapped yet.</div>
            </div>

            <textarea id="txt-input" placeholder="Extracted text will appear here. Or paste your own content manually.&#10;&#10;Punctuation is inherently analyzed to induce natural reading pauses..."></textarea>
            
            <div style="text-align:right; font-size:0.7rem; color:#555; margin-top:5px;">
                <span id="cnt-char">0</span> chars
            </div>

            <button id="btn-start" class="primary">Initiate Synced Stream</button>
        </div>
    </div>

    <!-- RSVP READER INTERFACE -->
    <div id="layer-reader" class="layer hidden">
        <div class="rsvp-stage">
            <div class="word-chunk c-left" id="r-left"></div>
            <div class="word-chunk c-pivot" id="r-pivot"></div>
            <div class="word-chunk c-right" id="r-right"></div>
        </div>
        <div class="hud">
            <button id="btn-stop" class="stop-btn">Terminate Stream</button>
        </div>
    </div>

    <script>
        /**
         * ReadSync | Enterprise Document Processing & Sync Audio Pipeline
         * Architecture: 
         *  - FileIngestionService (PDF, DOCX, EPUB handlers)
         *  - EdgeAIPipeline (Local Path mapping & API routing)
         *  - HybridSyncEngine (Bypasses Google TTS Boundary bugs via calculated interval fallback)
         */

        // --- Core Configuration ---
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const UI = {
            layers: { input: document.getElementById('layer-input'), reader: document.getElementById('layer-reader') },
            in: {
                dropZone: document.getElementById('drop-zone'),
                fileInput: document.getElementById('file-upload'),
                voice: document.getElementById('sel-voice'),
                rate: document.getElementById('rng-rate'),
                rateDisp: document.getElementById('disp-rate'),
                text: document.getElementById('txt-input'),
                count: document.getElementById('cnt-char'),
                start: document.getElementById('btn-start'),
                mainCard: document.getElementById('main-card'),
                edgeBtn: document.getElementById('btn-local-file'),
                edgeApi: document.getElementById('inp-edge-api'),
                edgePathDisp: document.getElementById('disp-local-path')
            },
            out: {
                left: document.getElementById('r-left'),
                pivot: document.getElementById('r-pivot'),
                right: document.getElementById('r-right'),
                stop: document.getElementById('btn-stop')
            }
        };

        const STATE = {
            voices: [],
            activeEngine: null,
            localModelHandle: null // For FileSystem Access API
        };

        // --- Initialization ---
        window.addEventListener('load', () => {
            loadVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
            bindEvents();
        });

        function bindEvents() {
            UI.in.rate.addEventListener('input', e => UI.in.rateDisp.innerText = parseFloat(e.target.value).toFixed(1));
            UI.in.text.addEventListener('input', e => UI.in.count.innerText = e.target.value.length);
            UI.in.start.addEventListener('click', startSequence);
            UI.out.stop.addEventListener('click', stopSequence);
            
            // Voice Select Logic (Edge Reveal)
            UI.in.voice.addEventListener('change', (e) => {
                if(e.target.value === 'EDGE_AI') UI.in.mainCard.classList.add('edge-active');
                else UI.in.mainCard.classList.remove('edge-active');
            });

            // Edge AI File Path Mapping
            UI.in.edgeBtn.addEventListener('click', async () => {
                try {
                    const [fileHandle] = await window.showOpenFilePicker({
                        types: [{ description: 'LLM Weights', accept: { 'application/octet-stream': ['.onnx', '.bin', '.pt'] } }]
                    });
                    STATE.localModelHandle = fileHandle;
                    const file = await fileHandle.getFile();
                    UI.in.edgePathDisp.innerText = `Mapped Path: Local Machine -> ${file.name}`;
                } catch (err) { console.log("File mapping aborted."); }
            });

            // File Ingestion
            UI.in.dropZone.addEventListener('click', () => UI.in.fileInput.click());
            UI.in.dropZone.addEventListener('dragover', (e) => { e.preventDefault(); UI.in.dropZone.classList.add('dragover'); });
            UI.in.dropZone.addEventListener('dragleave', () => UI.in.dropZone.classList.remove('dragover'));
            UI.in.dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                UI.in.dropZone.classList.remove('dragover');
                if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
            UI.in.fileInput.addEventListener('change', (e) => {
                if(e.target.files.length) handleFile(e.target.files[0]);
            });
        }

        // --- Multi-Format File Ingestion Service ---
        async function handleFile(file) {
            UI.in.dropZone.innerText = `Processing ${file.name}...`;
            let text = '';
            try {
                const ext = file.name.split('.').pop().toLowerCase();
                if (ext === 'txt') {
                    text = await file.text();
                } else if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    for(let i=1; i<=pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + ' ';
                    }
                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    text = result.value;
                } else if (ext === 'epub') {
                    const zip = await JSZip.loadAsync(file);
                    for (const filename of Object.keys(zip.files)) {
                        if (filename.match(/\.(html|xhtml|htm)$/i)) {
                            const htmlString = await zip.files[filename].async('string');
                            const doc = new DOMParser().parseFromString(htmlString, 'text/html');
                            text += doc.body.textContent + '\n';
                        }
                    }
                } else {
                    alert('Unsupported file type. Please use TXT, PDF, DOCX, or EPUB.');
                }
                
                UI.in.text.value = text.replace(/\s+/g, ' ').trim();
                UI.in.count.innerText = UI.in.text.value.length;
            } catch (error) {
                console.error("Ingestion Error:", error);
                alert("Failed to extract text. File might be corrupted or protected.");
            }
            UI.in.dropZone.innerText = "Drag & Drop Document (PDF, DOCX, EPUB) or Click to Browse";
        }

        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            if (!voices.length) return;

            STATE.voices = voices.sort((a, b) => {
                if(a.lang.startsWith('en') !== b.lang.startsWith('en')) return b.lang.startsWith('en') ? 1 : -1;
                return (b.name.includes('Google') || b.name.includes('Natural')) - (a.name.includes('Google') || a.name.includes('Natural'));
            });

            UI.in.voice.innerHTML = '<optgroup label="Enterprise Edge"><option value="EDGE_AI">Edge Compute Pipeline (Local LLM)</option></optgroup>';
            
            const nativeGroup = document.createElement('optgroup');
            nativeGroup.label = "Native System & Cloud Voices";
            
            STATE.voices.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${v.name.includes('Google') ? '★ ' : ''}${v.name}`;
                if(i === 0) opt.selected = true; // Default to best native
                nativeGroup.appendChild(opt);
            });
            UI.in.voice.appendChild(nativeGroup);
        }

        // --- Optical Alignment Engine ---
        function renderWord(rawToken) {
            if (!rawToken) return;
            const displayToken = rawToken.replace(/[.,;:"!?)(\]\[}]/g, '');
            if (!displayToken) return; 

            if (/^\d+$/.test(displayToken)) {
                UI.out.left.innerText = ''; UI.out.right.innerText = '';
                UI.out.pivot.innerText = displayToken;
                UI.out.pivot.classList.add('is-num');
                return;
            }

            UI.out.pivot.classList.remove('is-num');
            const len = displayToken.length;
            let idx = Math.max(0, Math.ceil(len / 2) - 1); // Default center pivot
            
            // Spiral search for ideal vowel
            const center = Math.floor(len / 2);
            for (let d = 0; d < len; d++) {
                if (center - d > 0 && /[aeiouy]/i.test(displayToken[center - d])) { idx = center - d; break; }
                if (center + d < len - 1 && d > 0 && /[aeiouy]/i.test(displayToken[center + d])) { idx = center + d; break; }
            }

            UI.out.left.innerText = displayToken.substring(0, idx);
            UI.out.pivot.innerText = displayToken[idx];
            UI.out.right.innerText = displayToken.substring(idx + 1);
        }

        // --- Audio & Visual Sync Architectures ---

        /** 
         * HYBRID SYNC ENGINE
         * Solves the Google TTS Bug where `onboundary` drops. 
         * Combines interval mathematics aligned to sentence durations with exact boundary snapping.
         */
        class HybridSyncEngine {
            constructor(text, voiceIndex, rate, renderCallback, onEndCallback) {
                // Chunk logically by sentences to preserve natural TTS flow and allow math sync
                this.sentences = text.match(/[^.!?]+[.!?]+/g);
                if (!this.sentences) {
                    // Fallback chunking for zero punctuation blocks
                    const words = text.split(/\s+/);
                    this.sentences = [];
                    for(let i=0; i<words.length; i+=12) this.sentences.push(words.slice(i, i+12).join(' '));
                }

                this.voiceIndex = voiceIndex;
                this.rate = rate;
                this.render = renderCallback;
                this.onEnd = onEndCallback;
                this.currentIdx = 0;
                this.isActive = false;
                this.timer = null;
            }

            start() {
                this.isActive = true;
                this.playNext();
            }

            stop() {
                this.isActive = false;
                clearInterval(this.timer);
                window.speechSynthesis.cancel();
            }

            playNext() {
                if (!this.isActive) return;
                if (this.currentIdx >= this.sentences.length) return this.onEnd();

                const sentence = this.sentences[this.currentIdx].trim();
                const words = sentence.split(/\s+/).filter(w => w.length > 0);
                if (!words.length) { this.currentIdx++; return this.playNext(); }

                const utt = new SpeechSynthesisUtterance(sentence);
                if (this.voiceIndex !== null && STATE.voices[this.voiceIndex]) {
                    utt.voice = STATE.voices[this.voiceIndex];
                }
                utt.rate = this.rate;
                utt.pitch = 1.0;

                let wordIdx = 0;
                // Base human reading = ~200 WPM at 1.0 rate
                const msPerWord = (60 / (200 * this.rate)) * 1000;

                utt.onstart = () => {
                    // Fallback mathematical progression
                    this.timer = setInterval(() => {
                        if (wordIdx < words.length) {
                            this.render(words[wordIdx]);
                            wordIdx++;
                        }
                    }, msPerWord);
                };

                utt.onboundary = (e) => {
                    if (e.name === 'word') {
                        // Intelligent snap-correction if the engine correctly fires boundaries
                        const charIndex = e.charIndex;
                        const exactIdx = sentence.substring(0, charIndex).split(/\s+/).length - 1;
                        if (exactIdx >= wordIdx && exactIdx < words.length) {
                            wordIdx = exactIdx;
                            this.render(words[wordIdx]);
                            wordIdx++;
                        }
                    }
                };

                utt.onend = () => {
                    clearInterval(this.timer);
                    this.currentIdx++;
                    this.playNext();
                };

                window.speechSynthesis.speak(utt);
            }
        }

        /**
         * EDGE AI PIPELINE
         * Validates and interfaces with local mapped LLM weights or internal APIs.
         */
        class EdgeAIPipeline {
            constructor(fileHandle, apiUrl) {
                this.fileHandle = fileHandle;
                this.apiUrl = apiUrl;
                this.fallbackEngine = null;
            }

            async process(text, rate, renderCallback, onEndCallback) {
                if (this.apiUrl && this.apiUrl.startsWith('http')) {
                    // Enterprise architecture for local API inference
                    try {
                        console.log(`[Edge AI] Routing to inference API: ${this.apiUrl}`);
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const res = await fetch(this.apiUrl, { method: 'POST', body: JSON.stringify({ text, rate }) });
                        const audioBuffer = await ctx.decodeAudioData(await res.arrayBuffer());
                        
                        // Buffer duration grants mathematical perfection for RSVP interval
                        const source = ctx.createBufferSource();
                        source.buffer = audioBuffer;
                        source.connect(ctx.destination);
                        
                        const words = text.split(/\s+/).filter(Boolean);
                        const msPerWord = (audioBuffer.duration * 1000) / words.length;
                        let wIdx = 0;
                        
                        this.timer = setInterval(() => {
                            if(wIdx < words.length) { renderCallback(words[wIdx]); wIdx++; }
                        }, msPerWord);

                        source.onended = () => { clearInterval(this.timer); onEndCallback(); };
                        this.currentSource = source;
                        source.start();

                    } catch(e) {
                        alert("Edge API Connection Failed. Ensure local server is active.");
                        onEndCallback();
                    }
                } else if (this.fileHandle) {
                    // Local machine filepath mapped via FileSystem API
                    const file = await this.fileHandle.getFile();
                    console.log(`[Edge AI] Mapped Local LLM Filepath: ${file.name}`);
                    // (Simulated WASM setup overhead)
                    console.log("[Edge AI] Routing to local WASM fallback renderer for MVP.");
                    
                    this.fallbackEngine = new HybridSyncEngine(text, null, rate, renderCallback, onEndCallback);
                    this.fallbackEngine.start();
                } else {
                    alert("Edge AI configuration missing. Please map a local file or provide an API endpoint.");
                    onEndCallback();
                }
            }

            stop() {
                if(this.timer) clearInterval(this.timer);
                if(this.currentSource) this.currentSource.stop();
                if(this.fallbackEngine) this.fallbackEngine.stop();
            }
        }

        // --- Core Application Controller ---
        function startSequence() {
            let raw = UI.in.text.value;
            if (!raw.trim()) return alert("No input text detected.");

            // Formatting pass to assure proper pipeline processing
            raw = raw.replace(/(\d+)/g, ' $1 ')
                     .replace(/[\r\n]+/g, '. ')
                     .replace(/([.,;?!])/g, '$1 ')
                     .replace(/\s+/g, ' ').trim();

            UI.layers.input.classList.add('hidden');
            UI.layers.reader.classList.remove('hidden');

            const rate = parseFloat(UI.in.rate.value);
            const voiceSelection = UI.in.voice.value;

            if (voiceSelection === 'EDGE_AI') {
                STATE.activeEngine = new EdgeAIPipeline(STATE.localModelHandle, UI.in.edgeApi.value);
                STATE.activeEngine.process(raw, rate, renderWord, stopSequence);
            } else {
                STATE.activeEngine = new HybridSyncEngine(raw, parseInt(voiceSelection), rate, renderWord, stopSequence);
                STATE.activeEngine.start();
            }
        }

        function stopSequence() {
            if (STATE.activeEngine) STATE.activeEngine.stop();
            STATE.activeEngine = null;
            
            UI.layers.reader.classList.add('hidden');
            UI.layers.input.classList.remove('hidden');

            UI.out.left.innerText = '';
            UI.out.pivot.innerText = '';
            UI.out.right.innerText = '';
        }

    </script>
</body>
</html>
